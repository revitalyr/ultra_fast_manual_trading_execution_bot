# cargo-deny configuration
# Install: cargo install cargo-deny
# Run:     cargo deny check

[advisories]
vulnerability = "deny"
unmaintained = "deny"
notice = "deny"
# Ignore specific advisories by ID, e.g.:
# ignore = ["RUSTSEC-2020-0001"]
yanked = "deny"

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
]
deny = [
    "AGPL-3.0",
    "GPL-3.0",
    "GPL-2.0",
]
# Skip confounding license identifiers
skip = []
skip-tree = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Allow certain crates to have multiple versions
skip-tree = []
deny = []
# Avoid crates that are no longer maintained
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-org = []
