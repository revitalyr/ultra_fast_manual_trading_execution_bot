[workspace]
resolver = "2"
members = ["."]

[package]
name = "ultra_fast_manual_trading_execution_bot"
version = "0.1.0"
edition = "2021"
authors = ["Trading Bot Team"]
description = "Ultra-fast manual trading execution bot for Polymarket"

[lib]
name = "ultra_fast_manual_trading_execution_bot"
path = "src/lib.rs"

[[bin]]
name = "ultra_fast_manual_trading_execution_bot"
path = "src/main.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[dependencies]
# Async runtime (minimal features)
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

# HTTP client with connection pooling
reqwest = { version = "0.12", features = ["json"] }

# WebSocket support
tokio-tungstenite = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Lock-free data structures for ultra-low latency
arc-swap = "1.7"
dashmap = "6.1"

# Terminal UI for keyboard shortcuts
crossterm = "0.28"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
bytes = "1.7"
hex = "0.4"
futures = "0.3"
async-trait = "0.1"

# Secrets management
secrecy = { version = "0.10", features = ["serde"] }

# Optional web UI
# axum = "0.8"
# tower = "0.5"

[profile.dev]
debug = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
# Uncomment below for production builds on target hardware:
# (see .cargo/config.toml for the actual flag)
# rustflags = ["-C", "target-cpu=native"]

# Sanitizer profiles — run with --profile san-{address,thread}
# Requires nightly Rust and appropriate platform support (Linux x86-64).
# Usage:
#   RUSTFLAGS="-Z sanitizer=address" cargo build --profile san-address --target x86_64-unknown-linux-gnu
#   RUSTFLAGS="-Z sanitizer=thread" cargo build --profile san-thread --target x86_64-unknown-linux-gnu
[profile.san-address]
inherits = "release"
debug = 1

[profile.san-thread]
inherits = "release"
debug = 1
