[package]
name = "ultra_fast_manual_trading_execution_bot"
version = "0.1.0"
edition = "2021"
authors = ["Trading Bot Team"]
description = "Ultra-fast manual trading execution bot for Polymarket"

[lib]
name = "ultra_fast_manual_trading_execution_bot"
path = "src/lib.rs"

[[bin]]
name = "ultra_fast_manual_trading_execution_bot"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "rt-multi-thread"] }

# HTTP client with connection pooling
reqwest = { version = "0.12", features = ["json", "stream"] }

# WebSocket support
tokio-tungstenite = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Lock-free data structures for ultra-low latency
arc-swap = "1.7"
dashmap = "6.1"

# Concurrency utilities
crossbeam = "0.8"

# Terminal UI for keyboard shortcuts
crossterm = "0.28"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
bytes = { version = "1.7", features = ["serde"] }
hex = "0.4"
futures = "0.3"
fastrand = "2.1"

# Optional web UI
# axum = "0.8"
# tower = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
