# Ultra Fast Manual Trading Execution Bot Configuration
# Copy this file to config.toml and customize for your needs.
#
# Field reference:
#   id                — unique match identifier (used internally)
#   name              — human-readable name shown in the dashboard
#   goal_market_id    — Polymarket market ID for the goal market
#   match_market_id   — Polymarket market ID for the match result market
#   max_price_limit   — maximum acceptable order price
#   keyboard_shortcut — single key that triggers execution (optional)

[[matches]]
id = "match_1"
name = "Arsenal vs Chelsea"
goal_market_id = "goal_market_arsenal_chelsea"
match_market_id = "match_result_arsenal_chelsea"
max_price_limit = 0.95
keyboard_shortcut = '1'

[[matches]]
id = "match_2"
name = "Real Madrid vs Barcelona"
goal_market_id = "goal_market_real_barcelona"
match_market_id = "match_result_real_barcelona"
max_price_limit = 0.95
keyboard_shortcut = '2'

[[matches]]
id = "match_3"
name = "PSG vs Marseille"
goal_market_id = "goal_market_psg_marseille"
match_market_id = "match_result_psg_marseille"
max_price_limit = 0.95
keyboard_shortcut = '3'
